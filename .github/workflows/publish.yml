name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url: it writes an .npmrc with setup-node's placeholder
          # NODE_AUTH_TOKEN, which makes npm skip the OIDC trusted-publishing
          # exchange and 404 on publish.

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance
